<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="NOTNGY 的个人主页。记录想法，分享创造。">
  <meta name="color-scheme" content="light">
  <title>NOTNGY · 个人主页</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; color: #24332b; background: #f6f5ef; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; }
    a { color: inherit; text-underline-offset: 5px; }
    a:focus-visible { outline: 3px solid #397a5b; outline-offset: 6px; }
    .wrap { width: min(100% - 48px, 1040px); margin-inline: auto; }
    header { padding-block: 32px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .wordmark { font-size: 17px; font-weight: 750; letter-spacing: .08em; text-decoration: none; }
    .nav-link { font-size: 14px; color: #536258; }
    main { flex: 1; display: grid; align-content: center; padding-block: 72px 96px; }
    .eyebrow { margin: 0 0 28px; font-size: 12px; font-weight: 650; letter-spacing: .19em; color: #61766a; }
    h1 { max-width: 850px; margin: 0; font-size: clamp(44px, 8.5vw, 88px); line-height: 1.15; font-weight: 650; letter-spacing: -.055em; }
    h1 span { color: #397a5b; }
    .intro { max-width: 540px; margin: 30px 0 0; font-size: clamp(16px, 2vw, 19px); line-height: 1.9; color: #617066; }
    .button { display: inline-flex; align-items: center; gap: 24px; justify-self: start; margin-top: 40px; padding: 15px 22px; border-radius: 8px; background: #243d30; color: #fff; text-decoration: none; font-size: 15px; }
    .button:hover { background: #356046; }
    .note { margin-top: 72px; padding-top: 22px; border-top: 1px solid #d9dfd5; display: flex; gap: 12px; align-items: baseline; color: #6b786e; font-size: 14px; line-height: 1.8; }
    .dot { width: 7px; height: 7px; flex: 0 0 7px; border-radius: 50%; background: #528a64; }
    footer { border-top: 1px solid #d9dfd5; padding-block: 24px; display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; font-size: 12px; color: #6b786e; }
    @media (max-width: 540px) { .wrap { width: calc(100% - 40px); } header { padding-block: 24px; } main { padding-block: 56px 64px; } .note { margin-top: 56px; } }
  </style>
</head>
<body>
  <header class="wrap">
    <a class="wordmark" href="/" aria-label="NOTNGY 首页">NOTNGY.</a>
    <a class="nav-link" href="https://github.com/NOTNGY">GitHub ↗</a>
  </header>
  <main class="wrap">
    <p class="eyebrow">A SMALL SPACE ON THE WEB</p>
    <h1>你好，我是 <span>NOTNGY。</span></h1>
    <p class="intro">欢迎来到我的个人主页。<br>在这里，记录想法，分享创造，也保留一点好奇心。</p>
    <a class="button" href="https://github.com/NOTNGY">到 GitHub 看看 <span aria-hidden="true">↗</span></a>
    <div class="note"><span class="dot" aria-hidden="true"></span><span>从这一页开始，慢慢添加更多内容。</span></div>
  </main>
  <footer class="wrap">
    <span>© NOTNGY</span>
    <span>Made with curiosity · Hosted on GitHub Pages</span>
  </footer>
</body>
</html>
